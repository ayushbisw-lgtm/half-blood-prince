<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coming Soon | Ayush Biswas</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #050510;
      overflow: hidden;
      color: #fff;
    }

    .coming-soon-container {
      text-align: center;
      z-index: 10;
      padding: 40px;
      max-width: 600px;
    }

    .coming-soon-card {
      background: rgba(15, 15, 35, 0.6);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(0, 240, 255, 0.2);
      border-radius: 24px;
      padding: 60px 40px;
      box-shadow: 0 0 50px rgba(0, 240, 255, 0.1);
      position: relative;
      overflow: hidden;
    }

    .coming-soon-card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(0, 240, 255, 0.05) 0%, transparent 70%);
      pointer-events: none;
    }

    .status-badge {
      display: inline-block;
      padding: 6px 16px;
      background: rgba(180, 74, 255, 0.1);
      border: 1px solid rgba(180, 74, 255, 0.3);
      border-radius: 20px;
      color: #b44aff;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 600;
      font-size: 0.9rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 3rem;
      margin-bottom: 16px;
      background: linear-gradient(135deg, #00f0ff, #b44aff);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800;
    }

    p {
      font-family: 'Inter', sans-serif;
      color: rgba(255, 255, 255, 0.7);
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 40px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 32px;
      background: linear-gradient(135deg, #00f0ff, #00d0ff);
      color: #050510;
      text-decoration: none;
      border-radius: 12px;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 1.1rem;
      transition: all 0.3s ease;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
    }

    .back-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.5);
    }

    .back-btn svg {
      transition: transform 0.3s ease;
    }

    .back-btn:hover svg {
      transform: translateX(-5px);
    }

    #particleCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="particleCanvas"></canvas>

  <div class="coming-soon-container">
    <div class="coming-soon-card">
      <div class="status-badge">Work in Progress</div>
      <h1>Coming Soon</h1>
      <p>This project is currently being polished. Stay tuned for a modern digital experience that combines design and technology.</p>
      <a href="index.html" class="back-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        Go Back Home
      </a>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
